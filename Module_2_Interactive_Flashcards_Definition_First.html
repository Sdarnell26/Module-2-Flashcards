<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 2 Interactive Flashcards</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#1f2937}
.wrap{width:min(900px,94%);margin:28px auto}
.top{text-align:center;margin-bottom:18px}
h1{margin:0 0 6px;color:#12335a;font-size:clamp(24px,4vw,36px)}
.sub{margin:0;color:#667085;font-size:16px}
.category{display:inline-block;margin-top:12px;padding:7px 12px;border-radius:999px;background:#e7eff8;color:#12335a;font-weight:700}
.card-scene{perspective:1200px;margin:22px auto 16px;width:100%;max-width:760px}
.card{position:relative;min-height:340px;width:100%;transform-style:preserve-3d;transition:transform .45s ease;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:34px;border:2px solid #d7dee8;border-radius:22px;background:#fff;box-shadow:0 10px 30px rgba(18,51,90,.08);backface-visibility:hidden}
.back{transform:rotateY(180deg)}
.label{position:absolute;top:18px;left:22px;color:#667085;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.front-text{font-size:clamp(32px,6vw,54px);line-height:1.15;font-weight:800;color:#12335a}
.back-text{font-size:clamp(24px,4.5vw,38px);line-height:1.25;font-weight:700}
.hint{position:absolute;bottom:16px;left:0;right:0;color:#667085;font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
button{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#2f6fa7;color:white}
button.secondary{background:white;color:#12335a;border:1px solid #d7dee8}
.progress{text-align:center;color:#667085;font-weight:700;margin-top:8px}
.bar{width:min(760px,100%);height:10px;margin:10px auto 0;border-radius:99px;background:#e4e9ef;overflow:hidden}
.fill{height:100%;width:0;background:#2f6fa7;transition:width .2s ease}
.footer{margin-top:18px;text-align:center;color:#667085;font-size:13px}
@media(max-width:600px){.card{min-height:300px}.face{padding:28px 20px}button{flex:1 1 42%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Module 2 Interactive Flashcards</h1>
    <p class="sub">Vocabulary • SI Units • Formulas</p>
    <div class="category" id="category">Vocabulary</div>
  </div>

  <div class="card-scene">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard. Press Enter or Space to flip.">
      <div class="face front">
        <div class="label">Definition / Prompt</div>
        <div class="front-text" id="frontText"></div>
        <div class="hint">Click the card to flip</div>
      </div>
      <div class="face back">
        <div class="label">Answer</div>
        <div class="back-text" id="backText"></div>
        <div class="hint">Click again to return</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button type="button" class="secondary" id="prevBtn">← Previous</button>
    <button type="button" id="flipBtn">Flip Card</button>
    <button type="button" class="secondary" id="nextBtn">Next →</button>
    <button type="button" class="secondary" id="shuffleBtn">Shuffle</button>
    <button type="button" class="secondary" id="resetBtn">Reset Order</button>
  </div>

  <div class="progress" id="progress">Card 1 of 17</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="footer">Keyboard: Left/Right arrows = previous/next • Space or Enter = flip</div>
</div>

<script>
const originalCards = [
  {category:"Vocabulary", front:"A change in an object's position relative to a reference point.", back:"Motion"},
  {category:"Vocabulary", front:"The total length of the path an object travels.", back:"Distance"},
  {category:"Vocabulary", front:"The change in position from the starting point to the ending point, including direction.", back:"Displacement"},
  {category:"Vocabulary", front:"The distance an object travels per unit of time.", back:"Speed"},
  {category:"Vocabulary", front:"Speed in a specific direction.", back:"Velocity"},
  {category:"Vocabulary", front:"A quantity that depends on an object's mass and velocity.", back:"Momentum"},
  {category:"Vocabulary", front:"The rate of change of velocity.", back:"Acceleration"},
  {category:"SI Units", front:"meter (m)", back:"SI Unit for Distance"},
  {category:"SI Units", front:"kilogram (kg)", back:"SI Unit for Mass"},
  {category:"SI Units", front:"meter per second squared (m/s²)", back:"SI Unit for Acceleration"},
  {category:"SI Units", front:"meter per second (m/s), with direction", back:"SI Unit for Velocity"},
  {category:"SI Units", front:"kilogram-meter per second (kg·m/s)", back:"SI Unit for Momentum"},
  {category:"Formulas", front:"s = d ÷ t", back:"Speed Formula"},
  {category:"Formulas", front:"d = s × t", back:"Distance Formula"},
  {category:"Formulas", front:"t = d ÷ s", back:"Time Formula"},
  {category:"Formulas", front:"p = m × v", back:"Momentum Formula"},
  {category:"Formulas", front:"a = (vᶠ − vᵢ) ÷ t", back:"Acceleration Formula"}
];

let cards = originalCards.map(c => ({...c}));
let index = 0;

const cardEl = document.getElementById("card");
const frontText = document.getElementById("frontText");
const backText = document.getElementById("backText");
const category = document.getElementById("category");
const progress = document.getElementById("progress");
const fill = document.getElementById("fill");

function render(){
  cardEl.classList.remove("flipped");
  const c = cards[index];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  category.textContent = c.category;
  progress.textContent = `Card ${index + 1} of ${cards.length}`;
  fill.style.width = `${((index + 1) / cards.length) * 100}%`;
}
function flip(){ cardEl.classList.toggle("flipped"); }
function next(){ index=(index+1)%cards.length; render(); }
function prev(){ index=(index-1+cards.length)%cards.length; render(); }
function shuffle(){
  for(let i=cards.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [cards[i],cards[j]]=[cards[j],cards[i]];
  }
  index=0; render();
}
function reset(){ cards=originalCards.map(c=>({...c})); index=0; render(); }

cardEl.addEventListener("click", flip);
document.getElementById("flipBtn").addEventListener("click", flip);
document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("shuffleBtn").addEventListener("click", shuffle);
document.getElementById("resetBtn").addEventListener("click", reset);
cardEl.addEventListener("keydown", e => {
  if(e.key==="Enter" || e.key===" "){ e.preventDefault(); flip(); }
});
document.addEventListener("keydown", e => {
  if(e.key==="ArrowRight") next();
  if(e.key==="ArrowLeft") prev();
});
render();
</script>
</body>
</html>
